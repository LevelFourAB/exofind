    post:
      summary: Create an API key
      description: |-
        Creates an API key and returns the generated credential string and key metadata. The full secret credential is returned only in this response because credentials are stored only as hashes. A lost credential cannot be recovered and must be replaced. Server logs record the key `id`, never the credential value.

        When a key is created, roles are expanded into their constituent permissions. Only the resulting permissions are stored in the key. Existing keys do not change permissions if role definitions change in later software versions.

        A key created on one node works on all nodes immediately because nodes look up unseen keys without delay. Served by whichever node receives the request.

        Requires the `keys.write` permission, which is not about one index. The `admin` role includes it.
      operationId: createKey
      tags:
      - API keys
      requestBody:
        content:
          application/json:
            examples:
              key:
                summary: "A reader of one index, expiring at a date"
                value:
                  description: the search backend
                  grants:
                  - role: reader
                    indexes:
                    - products
                  expiresAt: 2027-01-01T00:00:00Z
            schema:
              $ref: "#/components/schemas/KeyDefinition"
        required: true
      responses:
        "201":
          description: The key was created. The `credential` in this response is the
            only copy returned.
          content:
            application/json:
              examples:
                created:
                  value:
                    credential: exok_4ff6b760264c1918_ePQcdT1O9HSATZoXfDbT8hhHGsP9VpZH
                    key:
                      id: 4ff6b760264c1918
                      description: the search backend
                      grants:
                      - permissions:
                        - indexes.read
                        - search
                        indexes:
                        - products
                      createdAt: 2026-08-16T12:09:33.198275Z
                      expiresAt: 2027-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "400":
          description: |-
            The request body is missing, or the key definition failed validation. All validation errors are reported.

            Error codes: `request:missing_body` - The request carries no body. `auth:key:unknown_role` - The definition names a role this version does not have. `auth:key:unknown_permission` - The definition names a permission this version does not have. `auth:key:grants_required` - The definition holds no grant, so the key could do nothing. `auth:key:permissions_required` - A grant names neither a role nor a list of permissions. `auth:key:indexes_required` - A grant holds a permission that is about one index and does not say which indexes it covers. `auth:key:invalid_index_pattern` - An entry of `indexes` is neither an index name nor a prefix followed by `*`. `auth:key:indexes_not_used` - A grant names `indexes` and holds no permission that is about one index, so the patterns would narrow nothing. `auth:key:invalid_expiry` - `expiresAt` is not an ISO 8601 timestamp. `auth:key:expiry_in_past` - `expiresAt` has already passed, so the key would be lapsed from the moment it was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          x-error-codes:
          - code: request:missing_body
            when: The request carries no body.
          - code: auth:key:unknown_role
            when: The definition names a role this version does not have.
          - code: auth:key:unknown_permission
