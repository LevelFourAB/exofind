ides. `index:resources:synonyms:too_few_words` - A rule of equivalent synonyms carries fewer than two words. `index:resources:synonyms:blank_word` - A synonym is blank. `index:field:invalid_name` - A field name holds something other than letters, numbers, underscores and wildcards. To hold fields under a dotted path, declare an `object` field. `index:field:missing_type` - A field declares no type. `index:field:unsupported_type` - A field has a type this version of the engine cannot index. `index:field:invalid_name:primary_key_wildcard` - A field name with a wildcard is marked as the primary key. `index:field:invalid_primary_key_multiple` - The primary key field is also `multiple`. `index:field:invalid_primary_key_type` - The primary key field has a type that cannot be a primary key. `index:schema:multiple_primary_keys` - More than one field is marked as the primary key. `index:schema:primary_key_locale_specific` - The primary key field is locale specific. `index:schema:primary_key_not_required` - The primary key field is marked as not required. `index:schema:unsupported_features` - The definition needs engine features this version does not have. The `features` argument names them. `index:field:invalid_required` - A field name with a wildcard is marked as required. `index:field:invalid_sortable` - A field is both `sortable` and `multiple`. `index:field:sorting_not_supported` - A field is `sortable` and its type cannot be sorted on. `index:field:faceting_not_supported` - A field is faceted and its type cannot be counted per value. `index:field:signal_not_supported` - A field is a signal and its type cannot be refreshed in place. `index:field:signal:usage_conflict` - A signal field is also declared for a usage that would go stale on every refresh. `index:field:signal:wildcard` - A field name with a wildcard is a signal. A signal is refreshed by the name it was declared under. `index:field:locales:unsupported_locale` - A field names a locale this version of the engine does not support. `index:field:locales:fallback_without_index` - A field takes part in locale fallback and the index declares none. `index:locale_fallback:no_locale_fields` - The index falls back between locales and no field of it is locale specific. `index:locale_fallback:duplicate_locale` - A locale is fallen back to more than once. `index:locale_fallback:locale_not_held` - A locale is fallen back to that no field of the index holds values in. `index:locale_fallback:unsupported_locale` - A locale is fallen back to that this version of the engine does not support. `index:field:analyzer:ambiguous` - A usage carries an analysis chain and also names one in `resources`. Give at most one of the two. `index:field:analyzer:unknown_ref` - A usage names an analysis chain that `resources` does not define. `index:field:analyzer:unknown_stopwords` - An analysis chain names a stopword list that `resources` does not define. `index:field:analyzer:unknown_synonyms` - An analysis chain names a synonym set that `resources` does not define. `index:field:analyzer:unsupported_locale` - An analysis chain names a locale this version of the engine does not support. `index:field:analyzer:unsupported_decompounding` - An analysis chain splits compounds by a locale this version of the engine has no decompounding data for. `index:field:analyzer:invalid_grams` - An n-gram component asks for sizes below one, or a shortest longer than its longest. `index:field:analyzer:invalid_pattern` - A pattern replacement component carries something that is not a valid regular expression. `index:field:matching:invalid_weight` - The weight of matching is not above zero. `index:field:matching:invalid_typo_min_length` - The shortest word that may hold a typo is below one character. `index:field:matching:invalid_typo_order` - A word is long enough for two typos before it is long enough for one. `index:field:matching:invalid_typo_prefix` - The prefix matched exactly under typo tolerance is below zero. `index:field: