not_inside` - `hits` names a field that is not inside the object field it stands for. `search:hits:when_clause_invalid` - A clause under `hits.when` is neither a `field` nor a `nested` clause. `search:hits:when_scores` - A clause under `hits.when` affects the score. Clauses that score belong in `query`. `search:hits:when_field_sort` - A search whose hits are chosen by `hits.when` is ordered by a field. Order it by score. `search:hits:distance_sort` - A search whose hits are the values of an object field is ordered by distance. `search:hits:with_knn` - A search whose hits are the values of an object field holds a `knn` clause. `search:hits:with_matched` - A search whose hits are the values of an object field also asks for `matched`. `search:hits:with_highlight` - A search whose hits are the values of an object field highlights a field that is not inside those values. `search:signal:field_required` - A signal does not name the field to read its value from. `search:signal:shape_invalid` - A signal is not exactly one of `saturation`, `decay` and `linear`. `search:signal:pivot_invalid` - The `pivot` of a saturation signal is not a number above zero. `search:signal:half_life_invalid` - The `halfLife` of a decay signal is not a number of seconds above zero. `search:signal:ceiling_invalid` - The `ceiling` of a linear signal is not a number above zero. `search:signal:weight_invalid` - The `weight` of a signal is below zero. `search:signal:mode_without_signals` - `signalsMode` is given without `signals`. `search:rescore:window_required` - A `rescore` block does not say how many of the best results the second pass reaches. `search:rescore:window_invalid` - The `window` of a `rescore` block is below one or above `EXOFIND_SEARCH_MAX_RESCORE_WINDOW`. `search:rescore:window_too_small` - `offset` plus `limit` reaches past the `window` of a `rescore` block. `search:rescore:empty` - A `rescore` block holds neither a boost nor a signal to reorder by. `search:rescore:weight_invalid` - 