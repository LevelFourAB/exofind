    get:
      summary: Get an index
      description: |-
        Returns the index resource: its definition as stored, the generation described in the response, every generation it holds, and the status the answering node observes.

        The definition version is returned in the `ETag` header. Pass this value in the `If-Match` header on `PUT` requests to prevent overwriting concurrent updates.

