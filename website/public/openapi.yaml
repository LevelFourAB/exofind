ired` - A `rescore` block does not say how many of the best results the second pass reaches. `search:rescore:window_invalid` - The `window` of a `rescore` block is below one or above `EXOFIND_SEARCH_MAX_RESCORE_WINDOW`. `search:rescore:window_too_small` - `offset` plus `limit` reaches past the `window` of a `rescore` block. Widen the window, or ask for an earlier page. `search:rescore:empty` - A `rescore` block holds neither a boost nor a signal to reorder by. `search:rescore:weight_invalid` - The `weight` of a `rescore` block is below zero. `search:rescore:hits_unsupported` - A search whose hits are the values of an object field also asks to `rescore`. A second pass scores documents, so it cannot reorder values. `search:locale:unsupported` - The request names a locale this engine has no rules for. `index:query:source_not_kept` - `fields` asks for something only the document copy can answer on an index whose `source` is `none`. `index:query:interpret:no_unit` - An `interpret` target names a field that is not a number field or that declares no `unit`. `search:filter:scores` - A clause under `filter` affects the score. Move it out of `filter`. `index:query:field_not_found` - A clause names a field the index does not have. `index:query:usage_not_enabled` - A field is not defined for the usage the clause asks of it. `search:page:too_deep` - `offset` plus `limit` reaches past `EXOFIND_SEARCH_MAX_PAGE_DEPTH`. Follow the `next` cursor instead. `search:query:too_many_clauses` - The query holds more clauses than the node allows. `search:query:too_deep` - The query nests deeper than the node allows.
