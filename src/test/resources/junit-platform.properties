# Quarkus sets this orderer itself so that the tests of one test profile run
# together. It cannot set it while this file exists, because JUnit reads the
# first junit-platform.properties on the classpath and ignores the rest.
# Surefire fails the build when the line is missing.
junit.jupiter.testclass.order.default=io.quarkus.test.junit.util.QuarkusTestProfileAwareClassOrderer

# Test classes run in parallel. The methods of one class run one after another,
# so a class only has to be safe against other classes.
#
# Two annotations override this per class. @Isolated marks a Quarkus test,
# which boots an application and cannot share the JVM with another test.
# @Execution(CONCURRENT) marks a class whose own methods also run in parallel.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# One worker per available core.
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
