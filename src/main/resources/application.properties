quarkus.banner.enabled=false

# Names the node in the line reporting that it is up and what address it
# listens on. Without it that line carries the Maven artifact id, which says
# `engine` and leaves a log holding more than one service ambiguous.
quarkus.application.name=exofind

# The S3 clients are built from the remote.storage properties, so the
# extension's own configuration and its Dev Services stay unused.
quarkus.s3.devservices.enabled=false

# Having the extension on the classpath is what makes JSON output possible at
# all, and it would otherwise turn it on for every profile but dev and test.
# Left off so that a node read by a person reads as text, and a deployment
# shipping its log somewhere asks for JSON through
# QUARKUS_LOG_CONSOLE_JSON_ENABLED.
quarkus.log.console.json.enabled=false

# The example pages under examples/ are opened from disk or served from
# somewhere other than the node, so dev mode answers their requests whatever
# origin they come from. A deployment decides for itself, through
# QUARKUS_HTTP_CORS_ENABLED and QUARKUS_HTTP_CORS_ORIGINS.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/

# Dev mode runs against a throwaway node with no keys to present, so it checks
# none. Every other profile checks credentials unless a deployment says
# EXOFIND_AUTH_MODE=none, which is deliberately something to ask for by name.
%dev.exofind.auth.mode=none
%test.exofind.auth.mode=none
