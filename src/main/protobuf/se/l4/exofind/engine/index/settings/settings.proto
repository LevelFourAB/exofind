syntax = "proto3";

option java_multiple_files = true;

/*
 * Named so that the descriptor holder does not take the name of the engine
 * class that reads these messages.
 */
option java_outer_classname = "SearchSettingsProto";

package se.l4.exofind.engine.index.settings;

import "se/l4/exofind/engine/index/schema/definitions.proto";

/*
 * This file is the format the search settings of an index are stored in - one
 * object per index in the same storage the generations live in - so it has to
 * stay readable for as long as the index does. The same rules as for an index
 * definition apply: scalars are `optional` so unset can be told apart from the
 * zero value, and a field number is never reused.
 *
 * Settings change what a search answers, so a node that read only part of an
 * object would search differently from one that read all of it. Every
 * capability an object uses is therefore named in `required_features`, and a
 * node that does not know a name there sets the whole object aside rather than
 * applying the part it understands.
 */

/*
 * SearchSettingsStore is how searches of one index behave, kept apart from the
 * definition of what its documents were indexed as.
 *
 * The definition rides the sync manifest and every change to it goes through
 * the index's writer; these settings are one object replaced conditionally on
 * the version the writer read, so any node changes them and every node picks
 * the change up on its own refresh. They are scoped to the index name and not
 * to a generation, so a promotion keeps them.
 */
message SearchSettingsStore {
	/*
	 * Ranking that replaces the definition's whole, when present. An empty
	 * config is a real value - it turns the definition's ranking off - while
	 * an absent one leaves it in force.
	 */
	optional se.l4.exofind.engine.index.schema.RankingConfig ranking = 1;

	/*
	 * Synonym sets applied to the text of a search, by name.
	 *
	 * The sets a definition holds widen a value as it is indexed, so a rule
	 * added to one reaches only the documents indexed after it. These widen
	 * the search instead, so a rule takes effect over documents that were
	 * indexed long before it.
	 */
	map<string, QuerySynonyms> synonyms = 3;

	/*
	 * Words that are matched as they are spelled, by set name.
	 *
	 * The definition declares where typo tolerance applies, which is about the
	 * fields a search may spend a fuzzy walk on. These are about the words: a
	 * name or a code inside a field that is otherwise worth forgiving mistakes
	 * in.
	 */
	map<string, QueryTypoExclusions> typo_exclusions = 4;

	/*
	 * Settings that apply to one field of the index, keyed by the name of the
	 * field as a search names it. A field inside an object is keyed by its
	 * dotted path.
	 *
	 * The definition says what a field holds and how it is written. These say
	 * how a search reads the field, so a change to them reaches documents
	 * that were indexed long before it.
	 */
	map<string, FieldSettings> fields = 5;

	/*
	 * Names of the capabilities this object uses, written by whichever version
	 * of the engine last stored it.
	 *
	 * Unknown fields survive being parsed, so a node reading settings from a
	 * newer version sees a field it has no code for and would quietly search
	 * without it. Listing what an object needs turns that into something a
	 * node can check: one that does not know a name here searches with the
	 * definition alone instead of honoring half of what was written.
	 */
	repeated string required_features = 2;
}

/*
 * A synonym set applied to what a search asks for rather than to what a
 * document was indexed as.
 *
 * The rules are the ones an index-time set holds, so a set can be moved from
 * one side to the other without being rewritten. The side it is applied on is
 * the whole difference: an index-time set reaches only the documents indexed
 * after it, a query-time one reaches every document already there.
 *
 * The rules are applied after the analysis chain of the field has had the
 * text, so the terms of the rules are read through that chain as well: a term
 * the chain leaves nothing of, such as a stopword, matches nothing.
 */
message QuerySynonyms {
	/*
	 * The rules of the set. Absent, or holding no rules, widens nothing.
	 */
	optional se.l4.exofind.engine.index.schema.ResourcesDef.SynonymsResource set = 1;

	/*
	 * The fields the set is applied to, named as a search names them. Empty
	 * applies it to every field a search reads as text, the way a set written
	 * for a whole catalog is meant to work.
	 */
	repeated string fields = 2;

	/*
	 * What a term the rules added counts against the term that was typed, as a
	 * multiplier on the score it contributes. Absent means the engine default.
	 *
	 * Below one, a document holding the word that was typed ranks above one
	 * holding only a synonym of it. Exactly one makes the two count the same,
	 * the way an index-time set does.
	 */
	optional float boost = 3;
}

/*
 * Words a search matches as they are spelled, however many mistakes the
 * typo tolerance of the field would forgive.
 *
 * The words are read through the analysis chain of the field, the way the
 * terms of a query-time synonym rule are: a word the chain leaves nothing of,
 * such as a stopword, excludes nothing.
 *
 * The list is read against the words a search was typed with. A word that is
 * listed is looked up as it stands, and a word that is not keeps the
 * forgiveness the field declares - including when a near reading of it lands
 * on a listed word.
 */
message QueryTypoExclusions {
	/*
	 * The words, as they would be typed. Empty excludes nothing.
	 */
	repeated string words = 1;

	/*
	 * The fields the words are excluded in, named as a search names them.
	 * Empty covers every field a search reads as text, such as a list of brand
	 * names written for a whole catalog.
	 */
	repeated string fields = 2;
}

/*
 * How a search reads one field of the index.
 *
 * Every capability here is off unless its message is present, the way the
 * usages of a field definition are. An empty message turns the capability on
 * with the engine defaults.
 */
message FieldSettings {
	/*
	 * Present when a search in user mode reads the values the field holds out
	 * of the typed text, as a filter on the field. The field has to be a
	 * string field with both `filter` and `facet`; the values are looked up in
	 * the facet doc values of the generation that answers the search.
	 */
	optional InterpretConfig interpret = 1;

	/*
	 * The values of the field a facet orders and labels by declaration, in
	 * the order they were given. Empty declares nothing.
	 *
	 * A facet ordered by declaration answers these values first, by their
	 * `order`, and every other value after them by count. A value's label in
	 * the locale of a search is answered next to it, and a search reads the
	 * label out of typed text the way it reads the value. Only string fields
	 * with `facet` hold values to declare.
	 */
	repeated DeclaredValue values = 2;

	/*
	 * Present when the values the field holds are suggested while a search
	 * is typed. The field has to be a string field with `facet`; the values
	 * are read from the facet doc values of the generation that answers.
	 */
	optional SuggestConfig suggest = 3;
}

/*
 * Config for reading the values of a field out of the text of a search.
 * Carries no options; a later version may add some.
 */
message InterpretConfig {
}

/*
 * Config for suggesting the values of a field while a search is typed.
 * Carries no options; a later version may add some.
 */
message SuggestConfig {
}

/*
 * One value of a field, as it is stored, with what a search shows and orders
 * it by.
 */
message DeclaredValue {
	/*
	 * The value as the field stores it, which is what a facet counts and a
	 * filter matches.
	 */
	optional string value = 1;

	/*
	 * Where the value sits in a facet ordered by declaration, lower first.
	 * Absent leaves the value ordered by count after every value that has
	 * one, so labels can be declared without an order.
	 */
	optional int32 order = 2;

	/*
	 * What a person reads instead of the value, by BCP-47 tag. A search
	 * answers the label of its locale, and of the field's default locale
	 * where its own has none.
	 */
	map<string, string> labels = 3;
}
