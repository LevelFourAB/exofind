syntax = "proto3";

option java_multiple_files = true;

package se.l4.exofind.engine.index.state;

/*
 * This file is the format a synchronized index is described in, both in the
 * remote and on the disk of every node holding a copy, so it has to stay
 * readable for as long as an index exists. The same rules as for an index
 * definition apply: scalars are `optional` so unset can be told apart from
 * the zero value, and a field number is never reused.
 */

/**
 * ManifestFile represents a file in the index storage.
 */
message ManifestFile {
	/**
	 * The name of the file.
	 */
	string name = 1;
	/**
	 * The size of the file.
	 */
	int64 size = 2;
	/**
	 * CRC-32C of the contents, used to tell two versions of a file apart when
	 * they happen to be the same length.
	 *
	 * Unset in a manifest written before checksums were recorded, where the
	 * size is all there is to compare. A different algorithm would have to be
	 * a new field, as an old node has no way of telling which one produced a
	 * value it finds here.
	 */
	optional fixed32 checksum = 3;
	/**
	 * Key the file is stored under in the remote, relative to the index's
	 * prefix. Files are written under a prefix named for the epoch of the
	 * writer that uploaded them, and keep that key for as long as their
	 * contents stay the same, so a file is never uploaded again just because
	 * the epoch moved on.
	 *
	 * Unset in a manifest written before keys were recorded, where the name
	 * is also the key.
	 */
	optional string key = 4;
}

/**
 * Manifest is a list of files in the index storage.
 */
message Manifest {
	/**
	 * The latest segment number, as named by Lucene. Kept for describing what
	 * a manifest holds rather than for deciding whether it is current, as it
	 * only moves when Lucene commits and the manifest covers more than that.
	 */
	int64 latest_segment = 1;
	/**
	 * The list of files in the index storage, ordered by name.
	 */
	repeated ManifestFile files = 2;
	/**
	 * Incremented every time a manifest is pushed, so that two manifests can
	 * be ordered relative to each other.
	 *
	 * Unset in a manifest written before versions were recorded, which orders
	 * before every version a node writes.
	 */
	optional int64 version = 3;
	/**
	 * Epoch of the writer that produced this manifest. A writer session
	 * claims an epoch by rewriting the manifest with the next one before it
	 * uploads anything, and writes its files under a key prefix named for it,
	 * so the uploads of two sessions can never overwrite each other even when
	 * Lucene names their files the same.
	 *
	 * Unset in a manifest written before epochs were recorded, which reads as
	 * epoch zero.
	 */
	optional int64 epoch = 4;
	/**
	 * Major Lucene version the index was created with, which never changes for
	 * as long as the index exists. Lucene reads an index created by the
	 * current major and the one before it, and refuses anything older, so this
	 * is what says whether a build can still open the files - and, being in
	 * the manifest, says it before any of them are downloaded.
	 *
	 * Unset in a manifest written before the version was recorded, where the
	 * only way to find out is to read the segments after pulling them.
	 */
	optional int32 lucene_created_major = 5;
	/**
	 * Lucene version that wrote the newest commit, as it names itself. Kept
	 * for describing what produced the files rather than for deciding whether
	 * they can be read, which only the creating major has a say in.
	 *
	 * Unset in a manifest written before the version was recorded, or for an
	 * index that has no commit yet.
	 */
	optional string lucene_written_version = 6;
}

/**
 * IndexerLease was the claim a node held on being the one that indexes,
 * before leadership became per index. No longer written or read; the object
 * it was stored in may still exist in deployments that ran those versions,
 * and the message stays readable so the object can be understood if found.
 */
message IndexerLease {
	/**
	 * Node holding the lease.
	 */
	optional string node = 1;
	/**
	 * When the claim lapses unless renewed, as milliseconds since the Unix
	 * epoch. Compared against the clock of whoever reads it, so skew between
	 * nodes stretches or shrinks the wait - renewal happens well inside the
	 * duration to absorb that.
	 */
	optional int64 expires_at = 2;
	/**
	 * Address the node serves writes on, for pointing callers at it. Unset
	 * when the node has none to offer.
	 */
	optional string address = 3;
}

/**
 * IndexerLeadership is which node writes each index, next to which nodes
 * could. One object next to the indexes, replaced whole with a conditional
 * write like the manifests are, so two nodes changing it race for one write
 * exactly one of them wins.
 *
 * Holding a claim is a liveness matter - it decides who tries to write that
 * index. The conditional writes of the manifests are what keep a node that
 * wrongly still believes it holds a claim from doing damage, so a reader of
 * this message must never treat it as proof.
 */
message IndexerLeadership {
	/**
	 * One node's hold on writing one index.
	 */
	message Claim {
		/**
		 * Name of the index, without a generation - every generation of a
		 * name is written by the same node.
		 */
		optional string index = 1;
		/**
		 * Node holding the claim.
		 */
		optional string node = 2;
		/**
		 * Address the node serves writes to this index on. Unset when the
		 * node has none to offer.
		 */
		optional string address = 3;
		/**
		 * When the claim lapses unless renewed, as milliseconds since the
		 * Unix epoch. Compared against the clock of whoever reads it, so skew
		 * between nodes stretches or shrinks the wait - renewal happens well
		 * inside the duration to absorb that.
		 */
		optional int64 expires_at = 4;
		/**
		 * How heavily the index has recently been written where it is held:
		 * the bit length of a changed-document count that halves as it ages,
		 * so the value only moves when the load roughly doubles or halves.
		 * Absent or zero means idle. What candidates compare when they move
		 * indexes by write load rather than by count.
		 */
		optional uint32 load_bucket = 5;
		/**
		 * Set when the holder carries more write load than another candidate
		 * and offers this index up. Withdrawn by the holder writing the claim
		 * without it once the imbalance is gone.
		 */
		optional bool offered = 6;
		/**
		 * Candidate that answered the offer. Written into the holder's claim
		 * by the taker; the holder alone moves the claim, by rewriting it to
		 * name the taker, so setting this never takes an index by force.
		 */
		optional string taker = 7;
	}

	/**
	 * A node that competes for claims, kept current by the same renewals that
	 * keep its claims. Being listed is what lets the other candidates count
	 * heads when they divide the indexes up, and what gives an index with no
	 * claim somewhere to send a write.
	 */
	message Candidate {
		/**
		 * Node competing.
		 */
		optional string node = 1;
		/**
		 * Address the node serves writes on. Unset when the node has none to
		 * offer.
		 */
		optional string address = 2;
		/**
		 * When this entry lapses unless renewed, as milliseconds since the
		 * Unix epoch, read like the expiry of a claim.
		 */
		optional int64 expires_at = 3;
	}

	/**
	 * At most one claim per index. A claim past its expiry is free to be
	 * taken, not merely stale.
	 */
	repeated Claim claims = 1;

	/**
	 * The candidates that have renewed recently, one entry per node.
	 */
	repeated Candidate candidates = 2;
}

/**
 * ChangeLogStore is which documents of an index have changed since the index
 * began tracking its changes, stored next to the index files and carried in
 * the manifest while tracking runs.
 *
 * The log says which documents may differ from a copy taken when tracking
 * began, not what changed about them - a reader catches a copy up by reading
 * the named documents from the index as they are now. A key may be listed
 * for a document that was written back unchanged; a changed document is never
 * missing.
 */
message ChangeLogStore {
	/**
	 * Primary key terms of the documents that changed, as Lucene indexed them,
	 * one entry per document ordered by bytes. Comparable only with terms of
	 * an index whose primary key field has the same type.
	 */
	repeated bytes keys = 1;
}
