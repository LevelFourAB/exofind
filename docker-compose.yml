services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    container_name: seaweedfs
    ports:
      # S3 API; kept on 9000 so existing EXOFIND_STORAGE_REMOTE_URL values stay
      # valid
      - "9000:8333"
      # Filer UI, for browsing what is in the buckets
      - "8888:8888"
    volumes:
      - ./data/seaweedfs:/data
      - ./dev/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3-config.json
